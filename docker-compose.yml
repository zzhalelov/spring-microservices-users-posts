services:
  users-service:
    build: users-service/.
    ports:
      - "8081:8081"
    depends_on:
      - users-db
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  posts-service:
    build: posts-service/.
    ports:
      - "8082:8082"
    depends_on:
      - posts-db

    environment:
      - SPRING_PROFILES_ACTIVE=docker

  users-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=users
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  posts-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=posts
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres